llm:
  base-url: ${OPENAI_COMPAT_BASE_URL}
  base-uri: ${OPENAI_COMPAT_BASE_URI}
  api-key: ${OPENAI_COMPAT_API_KEY}
  model: ${OPENAI_COMPAT_MODEL}
  authorization-header: ${llm.authorization.header:Authorization}
  authorization-prefix: ${llm.authorization.prefix:Bearer}
memory-rag:
  qdrant-url: ${QDRANT_URL:http://127.0.0.1:6333}
  collection-name: ${MEMORY_RAG_COLLECTION:user_memories}
  vector-name: ${MEMORY_RAG_VECTOR_NAME:semantic}
  qdrant-api-key: ${QDRANT_API_KEY:}
embedding:
  base-url: ${EMBEDDING_BASE_URL}
  api-key: ${EMBEDDING_API_KEY}
  model: ${EMBEDDING_MODEL:text-embedding-v4}
  dimensions: ${EMBEDDING_DIMENSIONS:1024}
