[project]
name = "llm-agent-learning"
version = "0.1.0"
description = "Practice project for calling OpenAI-compatible LLM APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50,<2.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
